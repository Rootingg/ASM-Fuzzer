name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "tag must look like v0.1.0"
              exit 1
              ;;
          esac

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make

      - name: Test and build
        run: make test

      - name: Upload fuzzer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: asm-fuzzer-${{ github.ref_name }}
          path: build/asm-fuzzer
          if-no-files-found: error
