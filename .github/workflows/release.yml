name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "tag must look like v0.1.0"
              exit 1
              ;;
          esac

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make

      - name: Test and build
        run: make test

      - name: Upload fuzzer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: asm-fuzzer-${{ github.ref_name }}
          path: build/asm-fuzzer
          if-no-files-found: error
