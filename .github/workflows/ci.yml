name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make

      - name: Build project
        run: make all

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make

      - name: Run tests
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make

      - name: Lint sources
        run: make lint

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan workflows and secrets
        run: make security
